<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placeholder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b1d21;
      color: #e0e0e0;
      font-family: 'Red Hat Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .pf-empty-state {
      text-align: center;
      max-width: 448px;
      padding: 3rem 1.5rem;
    }

    .pf-empty-state__icon {
      margin-bottom: 1.5rem;
      color: #8a8d90;
    }

    .pf-empty-state__icon svg {
      width: 36px;
      height: 36px;
    }

    .pf-empty-state__title {
      font-size: 1.125rem;
      font-weight: 400;
      color: #e0e0e0;
      margin-bottom: 0.5rem;
    }

    .pf-empty-state__body {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #8a8d90;
    }
  </style>
</head>
<body>
  <div class="pf-empty-state">
    <div class="pf-empty-state__icon">
      <!-- PF wrench icon (fa-wrench) for configuration/setup scenarios -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true">
        <path d="M507.7 109.1c-2.2-9-13.5-12.1-20.1-5.5l-74.4 74.4-67.9-11.3-11.3-67.9 74.4-74.4c6.6-6.6 3.4-17.9-5.7-20.2-47.4-11.7-99.6.9-136.6 37.9-39.6 39.7-50.5 97.1-34 147.2L18.7 402.8c-25 25-25 65.5 0 90.5s65.5 25 90.5 0l213.2-213.2c50.1 16.7 107.5 5.7 147.4-34.2 37.1-37.1 49.7-89.3 37.9-136.8zM64 472c-13.3 0-24-10.7-24-24s10.7-24 24-24 24 10.7 24 24-10.7 24-24 24z"/>
      </svg>
    </div>
    <h1 class="pf-empty-state__title">Placeholder tab</h1>
    <div class="pf-empty-state__body">
      This tab is a stand-in for content development. Set a real URL in your config when the service is available.
    </div>
  </div>
</body>
</html>
