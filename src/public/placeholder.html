<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placeholder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b1d21;
      color: #d2d2d2;
      font-family: 'Red Hat Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .placeholder {
      text-align: center;
      max-width: 480px;
      padding: 2rem;
    }

    .placeholder-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placeholder-icon svg {
      width: 32px;
      height: 32px;
      color: #73bcf7;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      color: #e0e0e0;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.875rem;
      line-height: 1.6;
      color: #8a8d90;
    }

    code {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      font-family: 'Red Hat Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.8125rem;
      color: #73bcf7;
    }
  </style>
</head>
<body>
  <div class="placeholder">
    <div class="placeholder-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 16.875h3.375m0 0h3.375m-3.375 0V13.5m0 3.375v3.375M6 10.5h2.25a2.25 2.25 0 0 0 2.25-2.25V6a2.25 2.25 0 0 0-2.25-2.25H6A2.25 2.25 0 0 0 3.75 6v2.25A2.25 2.25 0 0 0 6 10.5Zm0 9.75h2.25A2.25 2.25 0 0 0 10.5 18v-2.25a2.25 2.25 0 0 0-2.25-2.25H6a2.25 2.25 0 0 0-2.25 2.25V18A2.25 2.25 0 0 0 6 20.25Zm9.75-9.75H18a2.25 2.25 0 0 0 2.25-2.25V6A2.25 2.25 0 0 0 18 3.75h-2.25A2.25 2.25 0 0 0 13.5 6v2.25a2.25 2.25 0 0 0 2.25 2.25Z" />
      </svg>
    </div>
    <h1>Placeholder Tab</h1>
    <p>This tab is a stand-in for content development. Set a real URL in your config when the service is available.</p>
    <code>url: /placeholder</code>
  </div>
</body>
</html>
